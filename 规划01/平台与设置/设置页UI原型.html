<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置页 UI 原型（独立面板）</title>
    <style>
      :root {
        --bg: #0b0d12;
        --card: rgba(255, 255, 255, 0.92);
        --panel: rgba(255, 255, 255, 0.78);
        --line: rgba(0, 0, 0, 0.16);
        --muted: rgba(0, 0, 0, 0.6);
        --danger: #b42318;
        --ok: #027a48;
        --warn: #b54708;
        --shadow: 0 20px 80px rgba(0, 0, 0, 0.45);
        --radius: 16px;
        --radius2: 12px;
        --gap: 12px;
        --settings-panel-h: 760px;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "PingFang SC", "Microsoft Yahei", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--sans);
        background: radial-gradient(1200px 700px at 50% 35%, rgba(71, 84, 103, 0.45), rgba(11, 13, 18, 0.9)),
          linear-gradient(135deg, rgba(59, 130, 246, 0.16), rgba(236, 72, 153, 0.12));
        color: #111827;
      }
      .overlay {
        min-height: 100vh;
        padding: 18px 12px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .card {
        width: min(1080px, calc(100% - 24px));
        height: var(--settings-panel-h);
        overflow: hidden;
        background: var(--card);
        border-radius: var(--radius);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      .header-left {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }
      .title {
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.3px;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(0, 0, 0, 0.12);
        font-size: 12px;
        font-weight: 800;
        color: rgba(0, 0, 0, 0.75);
        white-space: nowrap;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.28);
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.warn {
        background: var(--warn);
      }
      .dot.bad {
        background: var(--danger);
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .btn {
        appearance: none;
        border: 1px solid rgba(0, 0, 0, 0.22);
        background: rgba(255, 255, 255, 0.85);
        color: #111827;
        font-size: 14px;
        padding: 10px 12px;
        border-radius: 12px;
        cursor: pointer;
        transition: filter 120ms ease, transform 120ms ease, background 120ms ease;
        user-select: none;
        text-align: center;
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn:hover {
        filter: brightness(0.96);
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }
      .btn.primary {
        font-weight: 900;
        background: rgba(17, 24, 39, 0.92);
        color: #fff;
        border-color: rgba(17, 24, 39, 0.9);
      }
      .btn.danger {
        font-weight: 900;
        background: rgba(180, 35, 24, 0.1);
        border-color: rgba(180, 35, 24, 0.35);
        color: var(--danger);
      }
      .btn.ghost {
        background: transparent;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--gap);
        overflow: hidden;
        flex: 1;
        min-height: 0;
      }
      @media (min-width: 980px) {
        .layout {
          grid-template-columns: 0.34fr 0.66fr;
        }
      }
      .sidebar {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius2);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
      }
      .content {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius2);
        padding: 12px;
        min-height: 0;
        overflow: auto;
      }
      .sidebar-top {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .search {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.22);
        background: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        outline: none;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow: auto;
        padding-right: 2px;
      }
      .nav-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.22);
        background: rgba(255, 255, 255, 0.75);
        font-size: 13px;
        font-weight: 900;
        cursor: pointer;
        user-select: none;
        text-align: left;
      }
      .nav-btn[aria-selected="true"] {
        background: rgba(0, 0, 0, 0.08);
        border-color: rgba(0, 0, 0, 0.5);
      }
      .nav-meta {
        font-size: 11px;
        font-weight: 900;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.18);
        background: rgba(255, 255, 255, 0.7);
        color: rgba(0, 0, 0, 0.7);
        white-space: nowrap;
      }
      .panel {
        border: 1px solid rgba(0, 0, 0, 0.16);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.84);
        padding: 12px;
      }
      .panel h2 {
        margin: 0 0 10px 0;
        font-size: 14px;
        font-weight: 950;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      @media (min-width: 900px) {
        .grid.two {
          grid-template-columns: 1fr 1fr;
        }
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .row.spread {
        justify-content: space-between;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 200px;
        flex: 1;
      }
      label {
        font-size: 12px;
        font-weight: 900;
        color: rgba(0, 0, 0, 0.7);
      }
      select,
      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.22);
        background: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        outline: none;
      }
      input[type="text"].mono {
        font-family: var(--mono);
        font-size: 13px;
      }
      .hint {
        font-size: 12px;
        color: rgba(0, 0, 0, 0.62);
        line-height: 1.35;
      }
      .hint.bad {
        color: var(--danger);
        font-weight: 900;
      }
      .hint.ok {
        color: var(--ok);
        font-weight: 900;
      }
      .switch {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        background: rgba(255, 255, 255, 0.8);
        user-select: none;
        cursor: pointer;
      }
      .switch input {
        width: 16px;
        height: 16px;
        margin: 0;
      }
      .range {
        display: grid;
        grid-template-columns: 1fr 92px;
        gap: 10px;
        align-items: center;
      }
      .range input[type="range"] {
        width: 100%;
      }
      .table {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .item {
        border: 1px solid rgba(0, 0, 0, 0.16);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.82);
        padding: 10px;
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
      }
      .item[data-selected="true"] {
        border-color: rgba(0, 0, 0, 0.55);
        background: rgba(0, 0, 0, 0.06);
      }
      .item-main {
        min-width: 0;
      }
      .item-title {
        font-weight: 950;
        font-size: 13px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .sub {
        font-size: 12px;
        color: rgba(0, 0, 0, 0.65);
        margin-top: 4px;
        font-family: var(--mono);
        word-break: break-all;
      }
      .item-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .toast {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 18px;
        background: rgba(17, 24, 39, 0.92);
        color: #fff;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 900;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
        display: none;
        max-width: min(680px, calc(100% - 24px));
        text-align: center;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px 12px;
      }
      .modal-card {
        width: min(520px, calc(100% - 24px));
        background: rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        border: 1px solid rgba(0, 0, 0, 0.18);
        padding: 14px;
        box-shadow: var(--shadow);
      }
      .modal-card h3 {
        margin: 0 0 10px 0;
        font-size: 15px;
        font-weight: 950;
      }
      .hr {
        height: 1px;
        background: rgba(0, 0, 0, 0.14);
        margin: 10px 0;
      }
      .kbd {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 900;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.18);
        background: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <div class="card" role="dialog" aria-label="设置页 UI 原型（独立面板）">
        <div class="header">
          <div class="header-left">
            <div class="title">设置</div>
            <div id="persistence-pill" class="status-pill" aria-label="保存状态">
              <span id="persistence-dot" class="dot ok"></span>
              <span id="persistence-text">已保存</span>
            </div>
            <div id="modified-pill" class="status-pill" aria-label="默认值差异">
              <span id="modified-dot" class="dot ok"></span>
              <span id="modified-text">默认</span>
            </div>
          </div>
          <div class="header-right">
            <button id="btn-reset-all" class="btn danger" type="button">恢复默认</button>
            <button id="btn-close" class="btn ghost" type="button">关闭</button>
          </div>
        </div>

        <div class="layout">
          <div class="sidebar">
            <div class="sidebar-top">
              <input id="search" class="search" type="text" placeholder="搜索设置（原型）" />
              <div class="row" style="justify-content: space-between">
                <div class="hint" style="margin: 0">平台：<span id="platform" class="kbd"></span></div>
                <div class="hint" style="margin: 0">实例：<span id="instance" class="kbd"></span></div>
              </div>
            </div>
            <div id="nav" class="nav" role="tablist" aria-label="设置分类"></div>
          </div>

          <div class="content">
            <div id="page" role="tabpanel" aria-label="设置内容"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="modal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-card">
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
        <div class="hr"></div>
        <div class="row" style="justify-content: flex-end">
          <button id="modal-cancel" class="btn" type="button">取消</button>
          <button id="modal-ok" class="btn primary" type="button">确定</button>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      const deepClone = (v) => JSON.parse(JSON.stringify(v));
      const deepEqual = (a, b) => JSON.stringify(a) === JSON.stringify(b);

      const DEFAULT_SETTINGS = {
        general: { locale: "zh-CN", themeMode: "system", accent: "#7c3aed" },
        audio: { muted: false, master: 1, bgm: 0.8, sfx: 1, ui: 1 },
        network: { region: "auto", mode: "auto", latencyCompensation: true, inputPrediction: true },
        input: { aimAssist: true, gamepadEnabled: true, mappingPreset: "default" },
        quality: { preset: "auto", shadows: true, postProcess: true, particleDensity: 1, fpsCap: 120, vsync: true },
        accessibility: { reducedMotion: false, highContrast: false, colorBlind: "none", uiScale: 1.0 },
        data: { exportFormat: "zip", includeLogs: true, includeReplays: true, includeScreenshots: false },
      };

      const state = {
        platform: "tauri",
        instance: "default",
        ui: { cat: "general", query: "" },
        persistence: { status: "saved", lastSavedAt: Date.now(), error: "" },
        derived: { modifiedFromDefault: false, modifiedCategories: {} },
        data: { ...deepClone(DEFAULT_SETTINGS), about: { build: "dev", settingsSchemaVersion: 1, protocolVersion: 2 } },
      };

      const categories = [
        { id: "general", title: "通用", meta: "语言/主题" },
        { id: "audio", title: "声音", meta: "音量/静音" },
        { id: "network", title: "联机", meta: "模式/预测" },
        { id: "input", title: "控制", meta: "键位/手柄" },
        { id: "quality", title: "图形", meta: "质量/性能" },
        { id: "accessibility", title: "无障碍", meta: "对比/色盲" },
        { id: "data", title: "数据", meta: "导入/导出" },
        { id: "about", title: "关于", meta: "版本/协议" },
      ];

      const toastEl = $("toast");
      let toastTimer = null;
      const showToast = (text) => {
        toastEl.textContent = text;
        toastEl.style.display = "block";
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (toastEl.style.display = "none"), 1600);
      };

      const modalEl = $("modal");
      const modalTitleEl = $("modal-title");
      const modalBodyEl = $("modal-body");
      const modalCancelEl = $("modal-cancel");
      const modalOkEl = $("modal-ok");
      let modalResolve = null;
      const showModal = (title, body, okText = "确定") =>
        new Promise((resolve) => {
          modalTitleEl.textContent = title;
          modalBodyEl.innerHTML = "";
          modalBodyEl.appendChild(body);
          modalOkEl.textContent = okText;
          modalEl.style.display = "flex";
          modalResolve = resolve;
        });
      const closeModal = (result) => {
        modalEl.style.display = "none";
        if (modalResolve) modalResolve(result);
        modalResolve = null;
      };
      modalCancelEl.addEventListener("click", () => closeModal(false));
      modalOkEl.addEventListener("click", () => closeModal(true));
      modalEl.addEventListener("click", (e) => {
        if (e.target === modalEl) closeModal(false);
      });

      const persistenceDot = $("persistence-dot");
      const persistenceText = $("persistence-text");
      const modifiedDot = $("modified-dot");
      const modifiedText = $("modified-text");

      const setPersistenceStatus = (status, err = "") => {
        state.persistence.status = status;
        state.persistence.error = err;
        persistenceDot.className = "dot";
        if (status === "saved") persistenceDot.classList.add("ok");
        if (status === "saving") persistenceDot.classList.add("warn");
        if (status === "error") persistenceDot.classList.add("bad");
        persistenceText.textContent = status === "saved" ? "已保存" : status === "saving" ? "保存中" : "保存失败";
      };

      const recomputeDerived = () => {
        const cats = /** @type {const} */ (["general", "audio", "network", "input", "quality", "accessibility", "data"]);
        const modifiedCategories = {};
        for (const c of cats) {
          modifiedCategories[c] = !deepEqual(state.data[c], DEFAULT_SETTINGS[c]);
        }
        const modifiedFromDefault = Object.values(modifiedCategories).some(Boolean);
        state.derived.modifiedCategories = modifiedCategories;
        state.derived.modifiedFromDefault = modifiedFromDefault;
        modifiedDot.className = "dot";
        if (modifiedFromDefault) modifiedDot.classList.add("warn");
        else modifiedDot.classList.add("ok");
        modifiedText.textContent = modifiedFromDefault ? "已修改默认值" : "默认";
      };

      let saveTimer = null;
      const scheduleAutoSave = () => {
        setPersistenceStatus("saving");
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          state.persistence.lastSavedAt = Date.now();
          setPersistenceStatus("saved");
        }, 250);
      };

      const el = {
        nav: $("nav"),
        page: $("page"),
        search: $("search"),
        platform: $("platform"),
        instance: $("instance"),
        btnResetAll: $("btn-reset-all"),
        btnClose: $("btn-close"),
      };

      const normalize = (s) => (s || "").toLowerCase().trim();
      const matchQuery = (hay, q) => {
        const nq = normalize(q);
        if (!nq) return true;
        return normalize(hay).includes(nq);
      };

      const make = {
        panel: (title) => {
          const p = document.createElement("div");
          p.className = "panel";
          const h2 = document.createElement("h2");
          h2.textContent = title;
          p.appendChild(h2);
          return { el: p, h2 };
        },
        field: (labelText) => {
          const f = document.createElement("div");
          f.className = "field";
          const l = document.createElement("label");
          l.textContent = labelText;
          f.appendChild(l);
          return { el: f, label: l };
        },
        hint: (text, cls = "") => {
          const h = document.createElement("div");
          h.className = "hint" + (cls ? " " + cls : "");
          h.textContent = text;
          return h;
        },
        select: (options) => {
          const s = document.createElement("select");
          for (const o of options) {
            const opt = document.createElement("option");
            opt.value = o.value;
            opt.textContent = o.label;
            if (o.disabled) opt.disabled = true;
            s.appendChild(opt);
          }
          return s;
        },
        switch: (text) => {
          const wrap = document.createElement("label");
          wrap.className = "switch";
          const input = document.createElement("input");
          input.type = "checkbox";
          const span = document.createElement("span");
          span.textContent = text;
          wrap.appendChild(input);
          wrap.appendChild(span);
          return { wrap, input };
        },
        range: (min, max, step) => {
          const w = document.createElement("div");
          w.className = "range";
          const r = document.createElement("input");
          r.type = "range";
          r.min = String(min);
          r.max = String(max);
          r.step = String(step);
          const n = document.createElement("input");
          n.type = "number";
          n.min = String(min);
          n.max = String(max);
          n.step = String(step);
          w.appendChild(r);
          w.appendChild(n);
          return { wrap: w, range: r, num: n };
        },
        row: (spread = false) => {
          const r = document.createElement("div");
          r.className = "row" + (spread ? " spread" : "");
          return r;
        },
        kbd: (t) => {
          const k = document.createElement("span");
          k.className = "kbd";
          k.textContent = t;
          return k;
        },
      };

      const updateFrom = (path, value) => {
        const parts = path.split(".");
        let cur = state.data;
        for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
        cur[parts[parts.length - 1]] = value;
        recomputeDerived();
        scheduleAutoSave();
      };

      const renderNav = () => {
        el.nav.innerHTML = "";
        for (const c of categories) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "nav-btn";
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", String(state.ui.cat === c.id));
          const left = document.createElement("div");
          left.textContent = c.title;
          const meta = document.createElement("div");
          meta.className = "nav-meta";
          meta.textContent = c.meta;
          btn.appendChild(left);
          btn.appendChild(meta);
          btn.addEventListener("click", () => {
            state.ui.cat = c.id;
            render();
          });
          if (!matchQuery(c.title + " " + c.meta, state.ui.query)) {
            btn.style.display = "none";
          }
          el.nav.appendChild(btn);
        }
      };

      const renderPage = () => {
        el.page.innerHTML = "";

        const q = state.ui.query;
        const blocks = [];
        const push = (label, node) => {
          if (matchQuery(label, q)) blocks.push(node);
        };

        if (state.ui.cat === "general") {
          const p = make.panel("通用");
          const g = document.createElement("div");
          g.className = "grid two";

          const locale = make.field("语言");
          const localeSel = make.select([
            { value: "zh-CN", label: "简体中文" },
            { value: "en", label: "English" },
          ]);
          localeSel.value = state.data.general.locale;
          localeSel.addEventListener("change", () => updateFrom("general.locale", localeSel.value));
          locale.el.appendChild(localeSel);
          locale.el.appendChild(make.hint("切换语言后，UI 文案会立即更新。"));
          push("语言 locale 简体中文 English", locale.el);

          const themeMode = make.field("主题模式");
          const themeSel = make.select([
            { value: "system", label: "跟随系统" },
            { value: "light", label: "浅色" },
            { value: "dark", label: "深色" },
          ]);
          themeSel.value = state.data.general.themeMode;
          themeSel.addEventListener("change", () => updateFrom("general.themeMode", themeSel.value));
          themeMode.el.appendChild(themeSel);

          open.el.appendChild(make.hint("原型：只在 Tauri 可用；Web 需要替代路径（下载/上传）。"));
          push("目录 profile 配置", open.el);

          const danger = make.field("危险操作");
          const dr = make.row(true);
          dr.appendChild(make.hint("清空/重置应有二次确认与范围。"));
          const clear = document.createElement("button");
          clear.className = "btn danger";
          clear.type = "button";
          clear.textContent = "清空存档…";
          clear.addEventListener("click", async () => {
            const body = document.createElement("div");
            body.appendChild(make.hint("将清空：存档、回放、战斗缓存（示例）。", "bad"));
            const ok = await showModal("危险操作确认", body, "我已理解，继续");
            if (!ok) return;
            showToast("已清空（原型）");
          });
          danger.el.appendChild(dr);
          danger.el.appendChild(clear);
          push("清空 reset wipe", danger.el);

          g.appendChild(exp.el);
          g.appendChild(imp.el);
          g.appendChild(open.el);
          g.appendChild(danger.el);
          p.el.appendChild(g);

          blocks.push(p.el);
        }

        if (state.ui.cat === "about") {
          const p = make.panel("关于");
          const g = document.createElement("div");
          g.className = "grid";

          const a = make.panel("版本信息");
          const list = document.createElement("div");
          list.className = "table";
          const add = (t, v) => {
            const it = document.createElement("div");
            it.className = "item";
            const main = document.createElement("div");
            main.className = "item-main";
            const title = document.createElement("div");
            title.className = "item-title";
            title.textContent = t;
            const sub = document.createElement("div");
            sub.className = "sub";
            sub.textContent = v;
            main.appendChild(title);
            main.appendChild(sub);
            it.appendChild(main);
            const act = document.createElement("div");
            act.className = "item-actions";
            const b = document.createElement("button");
            b.className = "btn";
            b.type = "button";
            b.textContent = "复制";
            b.addEventListener("click", async () => {
              try {
                await navigator.clipboard.writeText(v);
                showToast("已复制");
              } catch {
                showToast("复制失败（原型）");
              }
            });
            act.appendChild(b);
            it.appendChild(act);
            list.appendChild(it);
          };
          add("Build", state.data.about.build);
          add("Settings Schema", "v" + state.data.about.settingsSchemaVersion);
          add("Protocol", "v" + state.data.about.protocolVersion);
          add("Profile", "profiles/" + state.instance);
          a.el.appendChild(list);

          const b = make.panel("支持");
          b.el.appendChild(make.hint("原型：这里可以放“打开日志/导出诊断包/查看许可证/问题反馈入口”。"));
          const row = make.row();
          const l1 = document.createElement("button");
          l1.className = "btn";
          l1.type = "button";
          l1.textContent = "导出诊断包…";
          l1.addEventListener("click", () => showToast("导出诊断包（原型）"));
          const l2 = document.createElement("button");
          l2.className = "btn";
          l2.type = "button";
          l2.textContent = "打开许可证";
          l2.addEventListener("click", () => showToast("打开许可证（原型）"));
          row.appendChild(l1);
          row.appendChild(l2);
          b.el.appendChild(row);

          g.appendChild(a.el);
          g.appendChild(b.el);
          p.el.appendChild(g);
          blocks.push(p.el);
        }

        if (blocks.length === 0) {
          const empty = make.panel("无匹配项");
          empty.el.appendChild(make.hint("没有匹配到任何设置项。"));
          blocks.push(empty.el);
        }

        for (const b of blocks) el.page.appendChild(b);
      };

      const render = () => {
        el.platform.textContent = state.platform;
        el.instance.textContent = state.instance;
        recomputeDerived();
        el.btnResetAll.disabled = !state.derived.modifiedFromDefault;
        renderNav();
        renderPage();
      };

      el.search.addEventListener("input", () => {
        state.ui.query = el.search.value;
        renderNav();
        renderPage();
      });

      el.btnResetAll.addEventListener("click", async () => {
        if (!state.derived.modifiedFromDefault) return;
        const body = document.createElement("div");
        body.appendChild(make.hint("将重置所有设置为默认值。", "bad"));
        body.appendChild(make.hint("建议：提供“按分类重置”和“仅重置本设备/仅重置本实例”。"));
        const ok = await showModal("确认恢复默认", body, "恢复默认");
        if (!ok) return;
        for (const [k, v] of Object.entries(DEFAULT_SETTINGS)) {
          state.data[k] = deepClone(v);
        }
        recomputeDerived();
        scheduleAutoSave();
        render();
        showToast("已恢复默认（原型）");
      });

      el.btnClose.addEventListener("click", async () => {
        showToast("已关闭（原型）");
      });

      const params = new URLSearchParams(location.search);
      const p = params.get("platform");
      const inst = params.get("instance");
      if (p === "web" || p === "tauri") state.platform = p;
      if (inst && /^[a-z0-9_-]{1,32}$/i.test(inst)) state.instance = inst;

      window.addEventListener("keydown", (e) => {
        if (e.key === "F1") {
          if (state.ui.cat !== "input") {
            state.ui.cat = "input";
            render();
          }
          showToast("快捷键：打开按键绑定（原型）");
        }
        if (e.key === "Escape") $("btn-close").click();
      });

      setPersistenceStatus("saved");
      recomputeDerived();
      render();
    </script>
  </body>
</html>
