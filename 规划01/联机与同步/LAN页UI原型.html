<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LAN 页 UI 原型</title>
    <style>
      :root {
        --bg: #0b0d12;
        --card: rgba(255, 255, 255, 0.92);
        --panel: rgba(255, 255, 255, 0.78);
        --line: rgba(0, 0, 0, 0.16);
        --muted: rgba(0, 0, 0, 0.6);
        --danger: #b42318;
        --ok: #027a48;
        --warn: #b54708;
        --shadow: 0 20px 80px rgba(0, 0, 0, 0.45);
        --radius: 16px;
        --radius2: 12px;
        --gap: 12px;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "PingFang SC", "Microsoft Yahei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--sans);
        background: radial-gradient(1200px 700px at 50% 35%, rgba(71, 84, 103, 0.45), rgba(11, 13, 18, 0.9)),
          linear-gradient(135deg, rgba(59, 130, 246, 0.16), rgba(236, 72, 153, 0.12));
        color: #111827;
      }

      .overlay {
        min-height: 100vh;
        padding: 18px 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: min(980px, calc(100% - 24px));
        max-height: calc(100vh - 24px);
        overflow: auto;
        background: var(--card);
        border-radius: var(--radius);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        padding: 14px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }

      .header-left {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }

      .title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.3px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.06);
        border: 1px solid rgba(0, 0, 0, 0.12);
        font-size: 12px;
        font-weight: 700;
        color: rgba(0, 0, 0, 0.75);
        white-space: nowrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.28);
      }

      .dot.ok {
        background: var(--ok);
      }
      .dot.warn {
        background: var(--warn);
      }
      .dot.bad {
        background: var(--danger);
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn {
        appearance: none;
        border: 1px solid rgba(0, 0, 0, 0.22);
        background: rgba(255, 255, 255, 0.85);
        color: #111827;
        font-size: 14px;
        padding: 10px 12px;
        border-radius: 12px;
        cursor: pointer;
        transition: filter 120ms ease, transform 120ms ease, background 120ms ease;
        user-select: none;
        text-align: center;
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn:hover {
        filter: brightness(0.96);
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }

      .btn.primary {
        font-weight: 800;
        background: rgba(17, 24, 39, 0.92);
        color: #fff;
        border-color: rgba(17, 24, 39, 0.9);
      }

      .btn.danger {
        font-weight: 800;
        background: rgba(180, 35, 24, 0.1);
        border-color: rgba(180, 35, 24, 0.35);
        color: var(--danger);
      }

      .btn.ghost {
        background: transparent;
      }

      .tabs {
        display: flex;
        gap: 8px;
        padding: 12px 0;
      }

      .tab {
        flex: 0 0 auto;
        padding: 9px 12px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.22);
        background: rgba(255, 255, 255, 0.75);
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        user-select: none;
      }

      .tab[aria-selected="true"] {
        background: rgba(0, 0, 0, 0.08);
        border-color: rgba(0, 0, 0, 0.5);
      }

      .tab:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--gap);
      }

      @media (min-width: 920px) {
        .grid.two {
          grid-template-columns: 1fr 1fr;
        }
        .grid.rooms {
          grid-template-columns: 1.1fr 0.9fr;
        }
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius2);
        padding: 12px;
      }

      .panel h2 {
        margin: 0 0 10px 0;
        font-size: 14px;
        font-weight: 900;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .row.spread {
        justify-content: space-between;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 180px;
        flex: 1;
      }

      label {
        font-size: 12px;
        font-weight: 800;
        color: rgba(0, 0, 0, 0.7);
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.22);
        background: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        outline: none;
      }

      input[type="text"].mono {
        font-family: var(--mono);
        font-size: 13px;
      }

      .hint {
        font-size: 12px;
        color: rgba(0, 0, 0, 0.62);
        line-height: 1.35;
      }

      .hint.bad {
        color: var(--danger);
        font-weight: 800;
      }

      .hint.ok {
        color: var(--ok);
        font-weight: 800;
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .item {
        border: 1px solid rgba(0, 0, 0, 0.16);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.82);
        padding: 10px;
        display: flex;
        gap: 10px;
        justify-content: space-between;
        align-items: center;
      }

      .item[data-selected="true"] {
        border-color: rgba(0, 0, 0, 0.55);
        background: rgba(0, 0, 0, 0.06);
      }

      .item-main {
        min-width: 0;
      }

      .item-title {
        font-weight: 900;
        font-size: 13px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .tag {
        font-size: 11px;
        font-weight: 900;
        padding: 4px 8px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.18);
        background: rgba(255, 255, 255, 0.7);
        color: rgba(0, 0, 0, 0.75);
        white-space: nowrap;
      }

      .sub {
        font-size: 12px;
        color: rgba(0, 0, 0, 0.65);
        margin-top: 4px;
        font-family: var(--mono);
        word-break: break-all;
      }

      .item-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .split {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .slot {
        flex: 1;
        min-width: 200px;
        border-radius: 14px;
        border: 1px solid rgba(0, 0, 0, 0.16);
        background: rgba(255, 255, 255, 0.84);
        padding: 10px;
      }

      .slot-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-weight: 900;
        font-size: 13px;
      }

      .slot-name {
        margin-top: 6px;
        font-size: 13px;
        color: rgba(0, 0, 0, 0.78);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .slot-meta {
        margin-top: 4px;
        font-size: 12px;
        color: rgba(0, 0, 0, 0.6);
      }

      .toast {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 18px;
        background: rgba(17, 24, 39, 0.92);
        color: #fff;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
        display: none;
        max-width: min(680px, calc(100% - 24px));
        text-align: center;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px 12px;
      }

      .modal-card {
        width: min(420px, calc(100% - 24px));
        background: rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        border: 1px solid rgba(0, 0, 0, 0.18);
        padding: 14px;
        box-shadow: var(--shadow);
      }

      .modal-card h3 {
        margin: 0 0 10px 0;
        font-size: 15px;
        font-weight: 900;
      }

      .hr {
        height: 1px;
        background: rgba(0, 0, 0, 0.14);
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <div class="card" role="dialog" aria-label="局域网联机 UI 原型">
        <div class="header">
          <div class="header-left">
            <div class="title">局域网联机</div>
            <div id="status-pill" class="status-pill">
              <span id="status-dot" class="dot"></span>
              <span id="status-text">未连接</span>
            </div>
          </div>
          <div class="header-right">
            <button id="btn-close" class="btn ghost" type="button">关闭</button>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="LAN 页签">
          <button id="tab-join" class="tab" type="button" role="tab" aria-selected="true">加入对局</button>
          <button id="tab-host" class="tab" type="button" role="tab" aria-selected="false">开服当房主</button>
          <button id="tab-lobby" class="tab" type="button" role="tab" aria-selected="false" disabled>房间与对局</button>
        </div>

        <div id="page-join" class="grid two" role="tabpanel" aria-label="加入对局"></div>
        <div id="page-host" class="grid" role="tabpanel" aria-label="开服当房主" style="display: none"></div>
        <div id="page-lobby" class="grid rooms" role="tabpanel" aria-label="房间与对局" style="display: none"></div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="modal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-card">
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
        <div class="hr"></div>
        <div class="row" style="justify-content: flex-end">
          <button id="modal-cancel" class="btn" type="button">取消</button>
          <button id="modal-ok" class="btn primary" type="button">确定</button>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      const state = {
        platform: "tauri",
        ui: { tab: "join" },
        connection: { status: "disconnected", wsUrl: "", error: "" },
        role: { kind: "none" },
        discovery: { status: "idle", entries: [], lastUpdatedAt: 0 },
        rooms: { list: [], selectedRoomId: "" },
        roomSession: { status: "none", roomId: "", role: "", ready: false, error: "" },
        hostConfig: { serverName: "我的服务器", roomName: "我的房间", codeRequiredDefault: false },
        clock: { now: Date.now() },
      };

      const pages = {
        join: $("page-join"),
        host: $("page-host"),
        lobby: $("page-lobby"),
      };

      const tabs = {
        join: $("tab-join"),
        host: $("tab-host"),
        lobby: $("tab-lobby"),
      };

      const toastEl = $("toast");
      let toastTimer = null;

      const modalEl = $("modal");
      const modalTitleEl = $("modal-title");
      const modalBodyEl = $("modal-body");
      const modalCancelEl = $("modal-cancel");
      const modalOkEl = $("modal-ok");
      let modalResolve = null;

      function setTab(tab) {
        state.ui.tab = tab;
        for (const k of ["join", "host", "lobby"]) {
          pages[k].style.display = k === tab ? "" : "none";
          tabs[k].setAttribute("aria-selected", String(k === tab));
        }
        render();
      }

      function setToast(text) {
        if (!text) return;
        toastEl.textContent = text;
        toastEl.style.display = "block";
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.style.display = "none";
          toastEl.textContent = "";
        }, 1400);
      }

      function openModal(opts) {
        modalTitleEl.textContent = opts.title || "";
        modalBodyEl.textContent = "";
        modalOkEl.textContent = opts.okText || "确定";
        modalCancelEl.textContent = opts.cancelText || "取消";
        modalOkEl.className = "btn primary";
        if (opts.okDanger) modalOkEl.className = "btn danger";
        modalEl.style.display = "flex";
        modalResolve = null;
        return new Promise((resolve) => {
          modalResolve = resolve;
          opts.render(modalBodyEl);
        });
      }

      function closeModal(result) {
        modalEl.style.display = "none";
        const r = modalResolve;
        modalResolve = null;
        if (r) r(result);
      }

      modalCancelEl.addEventListener("click", () => closeModal({ ok: false }));
      modalOkEl.addEventListener("click", () => closeModal({ ok: true }));
      modalEl.addEventListener("click", (e) => {
        if (e.target === modalEl) closeModal({ ok: false });
      });

      function updateStatusPill() {
        const dot = $("status-dot");
        const text = $("status-text");
        const c = state.connection.status;
        dot.className = "dot";
        if (c === "connected") dot.classList.add("ok");
        else if (c === "connecting") dot.classList.add("warn");
        else if (c === "error") dot.classList.add("bad");

        let label = "未连接";
        if (c === "connecting") label = "连接中…";
        if (c === "connected") {
          if (state.role.kind === "host") label = "已连接（服务器）";
          else label = state.roomSession.status === "inRoom" ? "已在房间" : "已连接";
        }
        if (c === "error") label = "连接失败";
        text.textContent = label;
      }

      function fakeSeedDiscovery() {
        const base = [
          { id: "a1", name: "PAMA-LAN", wsUrl: "ws://192.168.1.23:14201", src: "mDNS", seenAt: Date.now() },
          { id: "b2", name: "ROOMS-TEST", wsUrl: "ws://192.168.1.8:14201", src: "UDP", seenAt: Date.now() - 6000 },
          { id: "c3", name: "XIAO-MI", wsUrl: "ws://192.168.1.77:14201", src: "mDNS", seenAt: Date.now() - 1400 },
        ];
        state.discovery.entries = base;
        state.discovery.lastUpdatedAt = Date.now();
      }

      function fakeSeedRooms() {
        state.rooms.list = [
          { roomId: "r1", name: "默认房间", state: "等待中", codeRequired: false, slots: { p1: null, p2: null } },
          { roomId: "r2", name: "高手场", state: "进行中", codeRequired: true, slots: { p1: "已连接", p2: null } },
          { roomId: "r3", name: "观战位预留", state: "等待中", codeRequired: false, slots: { p1: null, p2: "已连接" } },
        ];
        if (!state.rooms.selectedRoomId) state.rooms.selectedRoomId = "r1";
      }

      function setConnected(wsUrl, roleKind) {
        state.connection.status = "connected";
        state.connection.error = "";
        state.connection.wsUrl = wsUrl;
        state.role.kind = roleKind;
        tabs.lobby.disabled = false;
        fakeSeedRooms();
        setTab("lobby");
        setToast("已连接");
      }

      function setDisconnected() {
        state.connection.status = "disconnected";
        state.connection.error = "";
        state.connection.wsUrl = "";
        state.role.kind = "none";
        state.rooms.list = [];
        state.rooms.selectedRoomId = "";
        state.roomSession = { status: "none", roomId: "", role: "", ready: false, error: "" };
        tabs.lobby.disabled = true;
        if (state.ui.tab === "lobby") setTab("join");
      }

      async function connectTo(wsUrl, roleKind) {
        if (!wsUrl || !/^wss?:\/\//.test(wsUrl)) {
          state.connection.status = "error";
          state.connection.error = "服务器地址格式不正确";
          setToast("地址格式不正确");
          render();
          return;
        }
        state.connection.status = "connecting";
        state.connection.error = "";
        state.connection.wsUrl = wsUrl;
        render();
        await new Promise((r) => setTimeout(r, 650));
        setConnected(wsUrl, roleKind);
        render();
      }

      async function joinRoom(slot) {
        const roomId = state.rooms.selectedRoomId;
        const room = state.rooms.list.find((r) => r.roomId === roomId);
        if (!room) return;
        if (state.connection.status !== "connected") return;

        if (room.codeRequired) {
          const result = await openModal({
            title: "请输入识别码",
            okText: "加入",
            render: (root) => {
              const f = document.createElement("div");
              f.className = "field";
              const lb = document.createElement("label");
              lb.textContent = `房间：${room.name}`;
              const input = document.createElement("input");
              input.type = "text";
              input.placeholder = "例如：1234";
              input.autocomplete = "off";
              input.spellcheck = false;
              input.id = "modal-code";
              f.appendChild(lb);
              f.appendChild(input);
              const h = document.createElement("div");
              h.className = "hint";
              h.textContent = "识别码由房主提供。";
              root.appendChild(f);
              root.appendChild(h);
              setTimeout(() => input.focus(), 0);
            },
          });
          if (!result.ok) return;
          const code = $("modal-code")?.value?.trim() || "";
          if (code !== "1234") {
            setToast("识别码错误（原型：正确为 1234）");
            return;
          }
        }

        state.roomSession.status = "joining";
        state.roomSession.error = "";
        render();
        await new Promise((r) => setTimeout(r, 450));
        state.roomSession.status = "inRoom";
        state.roomSession.roomId = roomId;
        state.roomSession.role = slot;
        state.roomSession.ready = false;
        render();
        setToast(`已加入为 ${slot.toUpperCase()}`);
      }

      function leaveRoom() {
        state.roomSession = { status: "none", roomId: "", role: "", ready: false, error: "" };
        render();
        setToast("已退出房间");
      }

      function toggleReady() {
        if (state.roomSession.status !== "inRoom") return;
        state.roomSession.ready = !state.roomSession.ready;
        render();
        setToast(state.roomSession.ready ? "已准备" : "已取消准备");
      }

      async function hostStartAndConnect() {
        if (state.platform !== "tauri") return;
        state.connection.status = "connecting";
        state.connection.error = "";
        render();
        await new Promise((r) => setTimeout(r, 650));
        setConnected("ws://127.0.0.1:14201", "host");
        render();
      }

      async function createRoom() {
        if (state.role.kind !== "host") return;
        const result = await openModal({
          title: "新建房间",
          okText: "创建",
          render: (root) => {
            const nameField = document.createElement("div");
            nameField.className = "field";
            const lb1 = document.createElement("label");
            lb1.textContent = "房间名";
            const nameInput = document.createElement("input");
            nameInput.type = "text";
            nameInput.value = "新房间";
            nameInput.id = "modal-room-name";
            nameInput.autocomplete = "off";
            nameInput.spellcheck = false;
            nameField.appendChild(lb1);
            nameField.appendChild(nameInput);

            const codeRow = document.createElement("div");
            codeRow.className = "row";
            codeRow.style.marginTop = "10px";
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.id = "modal-room-code-required";
            const lb2 = document.createElement("label");
            lb2.setAttribute("for", cb.id);
            lb2.textContent = "开启识别码";
            codeRow.appendChild(cb);
            codeRow.appendChild(lb2);

            const hint = document.createElement("div");
            hint.className = "hint";
            hint.textContent = "原型：开启识别码后，加入时需输入 1234。";

            root.appendChild(nameField);
            root.appendChild(codeRow);
            root.appendChild(hint);
            setTimeout(() => nameInput.focus(), 0);
          },
        });
        if (!result.ok) return;
        const name = $("modal-room-name")?.value?.trim() || "";
        const codeRequired = $("modal-room-code-required")?.checked === true;
        if (!name) {
          setToast("房间名不能为空");
          return;
        }
        const rid = `r${Math.floor(Math.random() * 9000 + 1000)}`;
        state.rooms.list = [{ roomId: rid, name, state: "等待中", codeRequired, slots: { p1: null, p2: null } }, ...state.rooms.list];
        state.rooms.selectedRoomId = rid;
        render();
        setToast("已创建房间");
      }

      async function closeRoom(roomId) {
        if (state.role.kind !== "host") return;
        const room = state.rooms.list.find((r) => r.roomId === roomId);
        if (!room) return;
        const result = await openModal({
          title: "确认关房？",
          okText: "关房",
          okDanger: true,
          render: (root) => {
            const p = document.createElement("div");
            p.className = "hint";
            p.textContent = `房间：${room.name}`;
            root.appendChild(p);
          },
        });
        if (!result.ok) return;
        state.rooms.list = state.rooms.list.filter((r) => r.roomId !== roomId);
        if (state.rooms.selectedRoomId === roomId) state.rooms.selectedRoomId = state.rooms.list[0]?.roomId || "";
        if (state.roomSession.roomId === roomId) leaveRoom();
        render();
        setToast("已关房");
      }

      async function renameRoom(roomId) {
        if (state.role.kind !== "host") return;
        const room = state.rooms.list.find((r) => r.roomId === roomId);
        if (!room) return;
        const result = await openModal({
          title: "房间改名",
          okText: "保存",
          render: (root) => {
            const f = document.createElement("div");
            f.className = "field";
            const lb = document.createElement("label");
            lb.textContent = "新房间名";
            const input = document.createElement("input");
            input.type = "text";
            input.value = room.name;
            input.id = "modal-room-rename";
            input.autocomplete = "off";
            input.spellcheck = false;
            f.appendChild(lb);
            f.appendChild(input);
            root.appendChild(f);
            setTimeout(() => input.focus(), 0);
          },
        });
        if (!result.ok) return;
        const name = $("modal-room-rename")?.value?.trim() || "";
        if (!name) {
          setToast("房间名不能为空");
          return;
        }
        room.name = name;
        render();
        setToast("已改名");
      }

      function copyInvite() {
        const roomId = state.rooms.selectedRoomId;
        const room = state.rooms.list.find((r) => r.roomId === roomId);
        const wsUrl = state.connection.wsUrl;
        const lines = [];
        lines.push(`局域网联机：服务器地址 ${wsUrl}`);
        if (room) {
          lines.push(`房间：${room.name}`);
          lines.push(room.codeRequired ? "识别码：由房主提供（原型正确为 1234）" : "无需识别码");
        }
        const text = lines.join("\n");
        navigator.clipboard
          .writeText(text)
          .then(() => setToast("已复制邀请信息"))
          .catch(() => setToast("复制失败（浏览器权限）"));
      }

      function renderJoinPage() {
        const root = pages.join;
        root.textContent = "";

        const discovery = document.createElement("div");
        discovery.className = "panel";
        const h2 = document.createElement("h2");
        h2.textContent = "附近服务器（自动发现）";
        discovery.appendChild(h2);

        const row = document.createElement("div");
        row.className = "row spread";
        const left = document.createElement("div");
        const isTauri = state.platform === "tauri";
        const st = state.discovery.status;
        const age = state.discovery.lastUpdatedAt ? Math.max(0, Math.round((state.clock.now - state.discovery.lastUpdatedAt) / 1000)) : 0;
        const text = !isTauri
          ? "网页版不支持自动发现"
          : st === "scanning"
            ? "扫描中…"
            : state.discovery.lastUpdatedAt
              ? `最近更新：${age} 秒前`
              : "未开始扫描";
        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent = text;
        left.appendChild(hint);
        row.appendChild(left);

        const actions = document.createElement("div");
        actions.className = "row";
        const scanBtn = document.createElement("button");
        scanBtn.className = "btn";
        scanBtn.type = "button";
        scanBtn.textContent = st === "scanning" ? "扫描中…" : "重新扫描";
        scanBtn.disabled = !isTauri || st === "scanning";
        scanBtn.addEventListener("click", async () => {
          state.discovery.status = "scanning";
          render();
          await new Promise((r) => setTimeout(r, 700));
          fakeSeedDiscovery();
          state.discovery.status = "idle";
          render();
          setToast("发现列表已更新");
        });
        actions.appendChild(scanBtn);
        row.appendChild(actions);
        discovery.appendChild(row);

        const list = document.createElement("div");
        list.className = "list";
        if (!isTauri) {
          const p = document.createElement("div");
          p.className = "hint";
          p.textContent = "请使用右侧“手动连接”输入服务器地址。";
          list.appendChild(p);
        } else if (state.discovery.entries.length === 0) {
          const p = document.createElement("div");
          p.className = "hint";
          p.textContent = "未发现服务器。你可以点击“重新扫描”，或让房主先开服。";
          list.appendChild(p);
        } else {
          for (const s of state.discovery.entries) {
            const item = document.createElement("div");
            item.className = "item";
            const main = document.createElement("div");
            main.className = "item-main";
            const title = document.createElement("div");
            title.className = "item-title";
            const name = document.createElement("span");
            name.textContent = s.name;
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = `${s.src} · #${s.id}`;
            title.appendChild(name);
            title.appendChild(tag);
            const sub = document.createElement("div");
            sub.className = "sub";
            sub.textContent = s.wsUrl;
            main.appendChild(title);
            main.appendChild(sub);
            item.appendChild(main);

            const itemActions = document.createElement("div");
            itemActions.className = "item-actions";
            const btnConnect = document.createElement("button");
            btnConnect.className = "btn primary";
            btnConnect.type = "button";
            btnConnect.textContent = "连接";
            btnConnect.addEventListener("click", () => connectTo(s.wsUrl, "client"));
            const btnCopy = document.createElement("button");
            btnCopy.className = "btn";
            btnCopy.type = "button";
            btnCopy.textContent = "复制地址";
            btnCopy.addEventListener("click", () => {
              navigator.clipboard
                .writeText(s.wsUrl)
                .then(() => setToast("已复制地址"))
                .catch(() => setToast("复制失败（浏览器权限）"));
            });
            itemActions.appendChild(btnConnect);
            itemActions.appendChild(btnCopy);
            item.appendChild(itemActions);
            list.appendChild(item);
          }
        }
        discovery.appendChild(list);

        const manual = document.createElement("div");
        manual.className = "panel";
        const h2b = document.createElement("h2");
        h2b.textContent = "手动连接";
        manual.appendChild(h2b);
        const f = document.createElement("div");
        f.className = "field";
        const lb = document.createElement("label");
        lb.textContent = "服务器地址（ws://...）";
        const input = document.createElement("input");
        input.type = "text";
        input.className = "mono";
        input.placeholder = "ws://192.168.1.23:14201";
        input.value = state.connection.wsUrl || "";
        input.addEventListener("input", () => {
          state.connection.wsUrl = input.value;
          if (state.connection.status === "error") state.connection.status = "disconnected";
          state.connection.error = "";
          render();
        });
        f.appendChild(lb);
        f.appendChild(input);
        manual.appendChild(f);

        const hint2 = document.createElement("div");
        hint2.className = "hint";
        hint2.textContent = "提示：桌面/安卓 App 可自动发现；网页版需手动填地址。";
        manual.appendChild(hint2);

        const btnRow = document.createElement("div");
        btnRow.className = "row";
        btnRow.style.marginTop = "10px";
        const btnConnect = document.createElement("button");
        btnConnect.className = "btn primary";
        btnConnect.type = "button";
        btnConnect.textContent = state.connection.status === "connecting" ? "连接中…" : "连接";
        btnConnect.disabled = state.connection.status === "connecting";
        btnConnect.addEventListener("click", () => connectTo(input.value.trim(), "client"));

        const btnDisconnect = document.createElement("button");
        btnDisconnect.className = "btn danger";
        btnDisconnect.type = "button";
        btnDisconnect.textContent = "断开";
        btnDisconnect.disabled = state.connection.status !== "connected";
        btnDisconnect.addEventListener("click", () => {
          setDisconnected();
          render();
          setToast("已断开");
        });

        btnRow.appendChild(btnConnect);
        btnRow.appendChild(btnDisconnect);
        manual.appendChild(btnRow);

        if (state.connection.status === "connected") {
          const ok = document.createElement("div");
          ok.className = "hint ok";
          ok.style.marginTop = "10px";
          ok.textContent = `已连接到服务器：${state.connection.wsUrl}`;
          manual.appendChild(ok);

          const go = document.createElement("button");
          go.className = "btn";
          go.type = "button";
          go.style.marginTop = "10px";
          go.textContent = "去选房间";
          go.addEventListener("click", () => setTab("lobby"));
          manual.appendChild(go);
        }

        if (state.connection.status === "error" && state.connection.error) {
          const err = document.createElement("div");
          err.className = "hint bad";
          err.style.marginTop = "10px";
          err.textContent = state.connection.error;
          manual.appendChild(err);
        }

        root.appendChild(discovery);
        root.appendChild(manual);
      }

      function renderHostPage() {
        const root = pages.host;
        root.textContent = "";

        const panel = document.createElement("div");
        panel.className = "panel";
        const h2 = document.createElement("h2");
        h2.textContent = "开服控制";
        panel.appendChild(h2);

        if (state.platform !== "tauri") {
          const p = document.createElement("div");
          p.className = "hint bad";
          p.textContent = "网页版不支持开服。请切到“加入对局”连接他人服务器。";
          panel.appendChild(p);
          root.appendChild(panel);
          return;
        }

        const row1 = document.createElement("div");
        row1.className = "row";
        const f1 = document.createElement("div");
        f1.className = "field";
        const lb1 = document.createElement("label");
        lb1.textContent = "服务器名";
        const in1 = document.createElement("input");
        in1.type = "text";
        in1.value = state.hostConfig.serverName;
        in1.addEventListener("input", () => (state.hostConfig.serverName = in1.value));
        f1.appendChild(lb1);
        f1.appendChild(in1);

        const f2 = document.createElement("div");
        f2.className = "field";
        const lb2 = document.createElement("label");
        lb2.textContent = "默认房间名";
        const in2 = document.createElement("input");
        in2.type = "text";
        in2.value = state.hostConfig.roomName;
        in2.addEventListener("input", () => (state.hostConfig.roomName = in2.value));
        f2.appendChild(lb2);
        f2.appendChild(in2);

        row1.appendChild(f1);
        row1.appendChild(f2);
        panel.appendChild(row1);

        const row2 = document.createElement("div");
        row2.className = "row";
        row2.style.marginTop = "10px";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = state.hostConfig.codeRequiredDefault;
        cb.addEventListener("change", () => (state.hostConfig.codeRequiredDefault = cb.checked));
        const lb3 = document.createElement("label");
        lb3.textContent = "默认开启识别码（房间级）";
        row2.appendChild(cb);
        row2.appendChild(lb3);
        panel.appendChild(row2);

        const hint = document.createElement("div");
        hint.className = "hint";
        hint.style.marginTop = "10px";
        hint.textContent = "原型：点击“一键开服并连接”后，会自动进入“房间与对局”。";
        panel.appendChild(hint);

        const row3 = document.createElement("div");
        row3.className = "row";
        row3.style.marginTop = "12px";

        const startBtn = document.createElement("button");
        startBtn.className = "btn primary";
        startBtn.type = "button";
        startBtn.textContent = state.connection.status === "connecting" ? "开服中…" : "一键开服并连接";
        startBtn.disabled = state.connection.status === "connecting" || state.connection.status === "connected";
        startBtn.addEventListener("click", hostStartAndConnect);

        const stopBtn = document.createElement("button");
        stopBtn.className = "btn danger";
        stopBtn.type = "button";
        stopBtn.textContent = "停止开服";
        stopBtn.disabled = state.connection.status !== "connected" || state.role.kind !== "host";
        stopBtn.addEventListener("click", async () => {
          const result = await openModal({
            title: "确认停止开服？",
            okText: "停止",
            okDanger: true,
            render: (r) => {
              const p = document.createElement("div");
              p.className = "hint";
              p.textContent = "这会断开所有连接，并停止在局域网内广播。";
              r.appendChild(p);
            },
          });
          if (!result.ok) return;
          setDisconnected();
          render();
          setToast("已停止开服");
        });

        row3.appendChild(startBtn);
        row3.appendChild(stopBtn);
        panel.appendChild(row3);

        if (state.connection.status === "connected" && state.role.kind === "host") {
          const ok = document.createElement("div");
          ok.className = "hint ok";
          ok.style.marginTop = "10px";
          ok.textContent = `运行中：${state.connection.wsUrl}`;
          panel.appendChild(ok);
        }

        root.appendChild(panel);
      }

      function renderLobbyPage() {
        const root = pages.lobby;
        root.textContent = "";

        const left = document.createElement("div");
        left.className = "panel";
        const h2 = document.createElement("h2");
        h2.textContent = "房间列表";
        left.appendChild(h2);

        const connRow = document.createElement("div");
        connRow.className = "row spread";
        const connInfo = document.createElement("div");
        connInfo.className = "hint";
        connInfo.textContent =
          state.connection.status === "connected"
            ? `服务器：${state.connection.wsUrl}`
            : "未连接。请先到“加入对局”连接服务器，或到“开服当房主”一键开服。";
        connRow.appendChild(connInfo);
        const connActions = document.createElement("div");
        connActions.className = "row";
        const btnDisconnect = document.createElement("button");
        btnDisconnect.className = "btn danger";
        btnDisconnect.type = "button";
        btnDisconnect.textContent = "断开";
        btnDisconnect.disabled = state.connection.status !== "connected";
        btnDisconnect.addEventListener("click", () => {
          setDisconnected();
          render();
          setToast("已断开");
        });
        connActions.appendChild(btnDisconnect);
        connRow.appendChild(connActions);
        left.appendChild(connRow);

        const toolRow = document.createElement("div");
        toolRow.className = "row";
        toolRow.style.marginTop = "10px";
        const btnRefresh = document.createElement("button");
        btnRefresh.className = "btn";
        btnRefresh.type = "button";
        btnRefresh.textContent = "刷新";
        btnRefresh.disabled = state.connection.status !== "connected";
        btnRefresh.addEventListener("click", async () => {
          setToast("已刷新（原型）");
          fakeSeedRooms();
          render();
        });
        toolRow.appendChild(btnRefresh);

        if (state.role.kind === "host") {
          const btnCreate = document.createElement("button");
          btnCreate.className = "btn primary";
          btnCreate.type = "button";
          btnCreate.textContent = "新建房间";
          btnCreate.addEventListener("click", createRoom);
          toolRow.appendChild(btnCreate);
        }
        left.appendChild(toolRow);

        const list = document.createElement("div");
        list.className = "list";
        list.style.marginTop = "10px";

        if (state.connection.status !== "connected") {
          const p = document.createElement("div");
          p.className = "hint";
          p.textContent = "连接成功后会在这里显示房间列表。";
          list.appendChild(p);
        } else if (state.rooms.list.length === 0) {
          const p = document.createElement("div");
          p.className = "hint";
          p.textContent = "无房间。";
          list.appendChild(p);
        } else {
          for (const r of state.rooms.list) {
            const item = document.createElement("div");
            item.className = "item";
            item.dataset.selected = String(state.rooms.selectedRoomId === r.roomId);
            item.addEventListener("click", () => {
              state.rooms.selectedRoomId = r.roomId;
              render();
            });
            const main = document.createElement("div");
            main.className = "item-main";
            const title = document.createElement("div");
            title.className = "item-title";
            const name = document.createElement("span");
            name.textContent = r.name;
            const tag1 = document.createElement("span");
            tag1.className = "tag";
            tag1.textContent = r.state;
            const tag2 = document.createElement("span");
            tag2.className = "tag";
            tag2.textContent = r.codeRequired ? "识别码：开" : "识别码：关";
            title.appendChild(name);
            title.appendChild(tag1);
            title.appendChild(tag2);
            const sub = document.createElement("div");
            sub.className = "sub";
            const p1 = r.slots.p1 ? "占用" : "空";
            const p2 = r.slots.p2 ? "占用" : "空";
            sub.textContent = `P1=${p1}  P2=${p2}  id=${r.roomId}`;
            main.appendChild(title);
            main.appendChild(sub);
            item.appendChild(main);

            const act = document.createElement("div");
            act.className = "item-actions";
            if (state.role.kind === "host") {
              const btnRename = document.createElement("button");
              btnRename.className = "btn";
              btnRename.type = "button";
              btnRename.textContent = "改名";
              btnRename.addEventListener("click", (e) => {
                e.stopPropagation();
                renameRoom(r.roomId);
              });
              const btnClose = document.createElement("button");
              btnClose.className = "btn danger";
              btnClose.type = "button";
              btnClose.textContent = "关房";
              btnClose.addEventListener("click", (e) => {
                e.stopPropagation();
                closeRoom(r.roomId);
              });
              act.appendChild(btnRename);
              act.appendChild(btnClose);
            }
            item.appendChild(act);
            list.appendChild(item);
          }
        }
        left.appendChild(list);

        const right = document.createElement("div");
        right.className = "panel";
        const h2b = document.createElement("h2");
        h2b.textContent = "房间详情";
        right.appendChild(h2b);

        const roomId = state.rooms.selectedRoomId;
        const room = state.rooms.list.find((r) => r.roomId === roomId);
        if (!room) {
          const p = document.createElement("div");
          p.className = "hint";
          p.textContent = "请先在左侧选择一个房间。";
          right.appendChild(p);
        } else {
          const meta = document.createElement("div");
          meta.className = "hint";
          meta.textContent = `房间：${room.name}  ·  ${room.codeRequired ? "需识别码" : "无需识别码"}  ·  RTT=26ms（原型）`;
          right.appendChild(meta);

          const split = document.createElement("div");
          split.className = "split";
          split.style.marginTop = "10px";

          const mkSlot = (slot) => {
            const taken = room.slots[slot] != null;
            const s = document.createElement("div");
            s.className = "slot";
            const st = document.createElement("div");
            st.className = "slot-title";
            const left = document.createElement("span");
            left.textContent = slot.toUpperCase();
            const rightTag = document.createElement("span");
            rightTag.className = "tag";
            if (state.roomSession.status === "inRoom" && state.roomSession.role === slot && state.roomSession.roomId === room.roomId) {
              rightTag.textContent = "你在此位";
            } else {
              rightTag.textContent = taken ? "已加入" : "等待加入";
            }
            st.appendChild(left);
            st.appendChild(rightTag);
            const nm = document.createElement("div");
            nm.className = "slot-name";
            nm.textContent = taken ? String(room.slots[slot]) : "空";
            const meta = document.createElement("div");
            meta.className = "slot-meta";
            meta.textContent = taken ? "状态：在线" : "状态：空位";
            s.appendChild(st);
            s.appendChild(nm);
            s.appendChild(meta);
            return s;
          };

          split.appendChild(mkSlot("p1"));
          split.appendChild(mkSlot("p2"));
          right.appendChild(split);

          const joinRow = document.createElement("div");
          joinRow.className = "row";
          joinRow.style.marginTop = "12px";

          const inRoom = state.roomSession.status === "inRoom" && state.roomSession.roomId === room.roomId;
          const btnJoinP1 = document.createElement("button");
          btnJoinP1.className = "btn primary";
          btnJoinP1.type = "button";
          btnJoinP1.textContent = inRoom ? "加入为 P1" : "加入为 P1";
          btnJoinP1.disabled =
            state.connection.status !== "connected" ||
            room.slots.p1 != null ||
            (state.roomSession.status === "joining") ||
            (inRoom && state.roomSession.role === "p1");
          btnJoinP1.addEventListener("click", () => joinRoom("p1"));

          const btnJoinP2 = document.createElement("button");
          btnJoinP2.className = "btn primary";
          btnJoinP2.type = "button";
          btnJoinP2.textContent = "加入为 P2";
          btnJoinP2.disabled =
            state.connection.status !== "connected" ||
            room.slots.p2 != null ||
            (state.roomSession.status === "joining") ||
            (inRoom && state.roomSession.role === "p2");
          btnJoinP2.addEventListener("click", () => joinRoom("p2"));

          const btnLeave = document.createElement("button");
          btnLeave.className = "btn danger";
          btnLeave.type = "button";
          btnLeave.textContent = "退出房间";
          btnLeave.disabled = !inRoom;
          btnLeave.addEventListener("click", leaveRoom);

          joinRow.appendChild(btnJoinP1);
          joinRow.appendChild(btnJoinP2);
          joinRow.appendChild(btnLeave);
          right.appendChild(joinRow);

          const ctl = document.createElement("div");
          ctl.className = "panel";
          ctl.style.marginTop = "12px";
          const h3 = document.createElement("h2");
          h3.textContent = "对局控制";
          ctl.appendChild(h3);

          if (!inRoom) {
            const p = document.createElement("div");
            p.className = "hint";
            p.textContent = "加入房间后可准备/开始，并可复制邀请信息。";
            ctl.appendChild(p);
          } else {
            const s = document.createElement("div");
            s.className = "hint";
            s.textContent = `你是 ${state.roomSession.role.toUpperCase()}  ·  ${state.roomSession.ready ? "已准备" : "未准备"}`;
            ctl.appendChild(s);

            const r = document.createElement("div");
            r.className = "row";
            r.style.marginTop = "10px";
            const btnReady = document.createElement("button");
            btnReady.className = "btn primary";
            btnReady.type = "button";
            btnReady.textContent = state.roomSession.ready ? "取消准备" : "准备";
            btnReady.addEventListener("click", toggleReady);
            r.appendChild(btnReady);

            const btnStart = document.createElement("button");
            btnStart.className = "btn";
            btnStart.type = "button";
            btnStart.textContent = "开始对局（房主）";
            btnStart.disabled = state.role.kind !== "host";
            btnStart.addEventListener("click", () => setToast("开始对局（原型）"));
            r.appendChild(btnStart);

            const btnInvite = document.createElement("button");
            btnInvite.className = "btn";
            btnInvite.type = "button";
            btnInvite.textContent = "复制邀请信息";
            btnInvite.addEventListener("click", copyInvite);
            r.appendChild(btnInvite);
            ctl.appendChild(r);
          }

          right.appendChild(ctl);
        }

        root.appendChild(left);
        root.appendChild(right);
      }

      function render() {
        updateStatusPill();

        const canGoLobby = state.connection.status === "connected";
        tabs.lobby.disabled = !canGoLobby;

        renderJoinPage();
        renderHostPage();
        renderLobbyPage();
      }

      $("btn-close").addEventListener("click", async () => {
        const result = await openModal({
          title: "关闭预览？",
          okText: "关闭",
          okDanger: true,
          render: (root) => {
            const p = document.createElement("div");
            p.className = "hint";
            p.textContent = "这是 UI 原型页面，不会影响任何后端状态。";
            root.appendChild(p);
          },
        });
        if (!result.ok) return;
        setToast("已关闭（原型：不会离开页面）");
      });

      tabs.join.addEventListener("click", () => setTab("join"));
      tabs.host.addEventListener("click", () => setTab("host"));
      tabs.lobby.addEventListener("click", () => {
        if (!tabs.lobby.disabled) setTab("lobby");
      });

      function syncClock() {
        state.clock.now = Date.now();
        if (state.ui.tab === "join") renderJoinPage();
      }

      setInterval(syncClock, 400);
      render();
    </script>
  </body>
</html>
